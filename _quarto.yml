project:
  type: book
  output-dir: docs

lang: ja

# 「公開」ではなく「更新日時」として見せる（この本は継続的に書き換わるため）
language:
  title-block-published: "更新日時"

book:
  title: "Collective Predictive Coding"
  subtitle: "An Introduction to the Mathematical Theory of Symbol Emergence Systems"
  author: "Tadahiro Taniguchi"
  date: last-modified
  date-format: "YYYY年M月D日 HH:mm"
  search: true
  repo-url: https://github.com/tanichu/cpc-textbook
  repo-actions: [issue]
  sidebar:
    style: docked
    logo: figures/logo-sel.png
    logo-alt: "記号創発システム研究室 / Symbol Emergence Systems Lab."
  page-footer:
    left: "© 2026 Tadahiro Taniguchi"
    right: "執筆中のドラフトです。引用・転載はお控えください。"
  chapters:
    - index.qmd
    - chapters/00-how-to-read.qmd
  appendices:
    - chapters/99-glossary-ja-en.qmd

format:
  html:
    theme: cosmo
    toc: true
    html-math-method: katex
    include-after-body: _includes/date-link.html
  pdf:
    documentclass: scrbook
    papersize: a4
    keep-tex: true
