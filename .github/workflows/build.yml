name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The title block shows a last-modified timestamp; render it in JST.
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Render HTML
        run: quarto render --to html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # Japanese typesetting needs LuaTeX-ja and the Harano Aji fonts, which
      # TinyTeX does not ship. Quarto's auto-install pulls both during the
      # render, so no explicit tlmgr step is needed.
      #
      # The PDF is best-effort: a LaTeX failure must not block the site.
      - name: Render PDF
        id: pdf
        continue-on-error: true
        run: quarto render --to pdf

      # A PDF with no Japanese in it is worse than no PDF, so check before
      # publishing. The book is written in Japanese; a healthy build is well
      # over half Japanese characters.
      - name: Check that the PDF contains Japanese
        id: pdfcheck
        if: steps.pdf.outcome == 'success'
        run: |
          python3 -m pip install --quiet pypdf
          python3 - <<'EOF'
          import glob, sys
          import pypdf
          paths = glob.glob("docs/*.pdf")
          if not paths:
              sys.exit("no PDF was produced")
          text = "".join(
              (page.extract_text() or "")
              for page in pypdf.PdfReader(paths[0]).pages
          )
          jp = sum(
              1 for c in text
              if "぀" <= c <= "ヿ" or "一" <= c <= "鿿"
          )
          ratio = jp / max(len(text), 1)
          print(f"{paths[0]}: {jp} Japanese characters, ratio {ratio:.3f}")
          if ratio < 0.2:
              sys.exit("the PDF lost its Japanese text; not publishing it")
          EOF

      - name: Attach PDF to the "latest" release
        if: steps.pdf.outcome == 'success' && steps.pdfcheck.outcome == 'success'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest draft
          prerelease: true
          files: docs/*.pdf

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
