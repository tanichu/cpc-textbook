<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360"
     font-family="Helvetica, Arial, sans-serif" role="img"
     aria-label="共有表現 w から各エージェントの内部表現 z_k が生成され、そこから観測 x_k が生成されるグラフィカルモデル。z_k と x_k は K 個のエージェントを表すプレートで囲まれている">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- w : 共有される記号（潜在変数） -->
  <circle cx="300" cy="48" r="27" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
  <text x="300" y="56" text-anchor="middle" font-size="22" font-style="italic">w</text>
  <text x="264" y="26" text-anchor="end" font-size="14" fill="#555555">p(w)</text>

  <!-- plate: K 個のエージェント -->
  <rect x="120" y="106" width="360" height="200" rx="6"
        fill="none" stroke="#777777" stroke-width="1.3"/>
  <text x="466" y="296" text-anchor="end" font-size="15" font-style="italic" fill="#555555">K</text>

  <!-- z_k : 内部表現（潜在変数） -->
  <circle cx="300" cy="166" r="27" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
  <text x="300" y="174" text-anchor="middle" font-size="20" font-style="italic">z<tspan font-size="13" dy="5">k</tspan></text>

  <!-- x_k : 観測（観測変数は灰色で塗る） -->
  <circle cx="300" cy="256" r="27" fill="#dcdcdc" stroke="#333333" stroke-width="1.6"/>
  <text x="300" y="264" text-anchor="middle" font-size="20" font-style="italic">x<tspan font-size="13" dy="5">k</tspan></text>

  <!-- 生成の矢印 -->
  <line x1="300" y1="75" x2="300" y2="137" stroke="#333333" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="300" y1="193" x2="300" y2="227" stroke="#333333" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 因子の注記（右側） -->
  <text x="338" y="112" font-size="15" fill="#444444">p(z<tspan font-size="11" dy="4">k</tspan><tspan font-size="15" dy="-4"> | w)</tspan></text>
  <text x="338" y="216" font-size="15" fill="#444444">p(x<tspan font-size="11" dy="4">k</tspan><tspan font-size="15" dy="-4"> | z</tspan><tspan font-size="11" dy="4">k</tspan><tspan font-size="15" dy="-4">)</tspan></text>

  <!-- 二つの経路（左側・プレート内） -->
  <text x="272" y="108" text-anchor="end" font-size="13" fill="#666666">トップダウン</text>
  <text x="272" y="126" text-anchor="end" font-size="12" fill="#888888">記号が表現を方向づける</text>
  <text x="272" y="212" text-anchor="end" font-size="13" fill="#666666">ボトムアップ</text>
  <text x="272" y="230" text-anchor="end" font-size="12" fill="#888888">表現が観測を説明する</text>

  <!-- 凡例 -->
  <circle cx="132" cy="336" r="9" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
  <text x="148" y="341" font-size="13" fill="#444444">潜在変数（観測できない）</text>
  <circle cx="320" cy="336" r="9" fill="#dcdcdc" stroke="#333333" stroke-width="1.3"/>
  <text x="336" y="341" font-size="13" fill="#444444">観測変数</text>
</svg>
